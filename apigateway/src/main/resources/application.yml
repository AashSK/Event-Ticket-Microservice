keycloak:
  auth:
    jwk-set-uri: http://127.0.0.1:8091/realms/ticketing-security-realm/protocol/openid-connect/certs

#Actuator
#management.health.circuitbreakers.enabled: true

#Exposing all endpoints
#management.endpoints.web.exposure.include: '*'
#management.endpoint.health.show-details: always

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include:
          - health
          - metrics
          - circuitbreakers

  health:
    circuitbreakers:
      enabled: true

#Resilience4j properties
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 8
        failureRateThreshold: 50
        minimumNumberOfCalls: 4
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      bookingServiceCircuitBreaker:
        baseConfig: default

  timelimiter:
    configs:
      default:
        timeoutDuration: 3s

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 2s