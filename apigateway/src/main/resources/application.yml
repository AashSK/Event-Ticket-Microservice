server:
  port: 8082

spring:
  application:
    name: apigateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://127.0.0.1:8091/realms/ticketing-security-realm
#  Gateway Routing Logic in YAML below
  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 5s 

      # mvc:
